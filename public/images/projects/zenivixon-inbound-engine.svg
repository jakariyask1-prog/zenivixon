  <text x="448" y="360" fill="#93C5FD" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">⚡ Live Dogfooding Guarantee</text>
  <text x="448" y="378" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="10">Test this system right now via the Contact page or Chat.</text>
  <text x="448" y="394" fill="#60A5FA" font-family="monospace" font-size="9">Zero manual intervention • Sub-second throughput</text>
</svg>