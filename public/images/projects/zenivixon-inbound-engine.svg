  <text x="64" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">ZENIVIXON Autonomous Inbound Engine // 24/7 AI Consultant &amp; Dual Relay</text>
  <rect x="636" y="30" width="128" height="24" rx="6" fill="#1E3A8A" stroke="#3B82F6"/>
  <text x="648" y="46" fill="#93C5FD" font-family="monospace" font-size="11" font-weight="700">Latency: 1.4s (Live)</text>

  <!-- Left: Live AI Consultant Chat Widget Interface -->
  <rect x="24" y="78" width="360" height="348" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
