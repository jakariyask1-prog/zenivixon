  <text x="52" y="154" fill="#93C5FD" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">AI Consultant:</text>
  <text x="52" y="170" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="10">Hello! What enterprise workflow would you like to automate?</text>

  <!-- Chat Bubble 2 (User) -->
  <rect x="90" y="194" width="278" height="48" rx="8" fill="#1D4ED8"/>
  <text x="102" y="212" fill="#DBEAFE" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Client:</text>
  <text x="102" y="228" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10">We need an automated invoice ingestion pipeline for QuickBooks.</text>

  <!-- Chat Bubble 3 (Assistant Recommendation) -->
