  <rect x="432" y="122" width="326" height="62" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="452" cy="153" r="10" fill="#2563EB"/>
  <text x="470" y="146" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">1. Google Gemini 2.0 Lead Analysis</text>
  <text x="470" y="162" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Classifies ICP fit, Priority: HIGH, Category: AI Automation</text>
  <text x="470" y="174" fill="#34D399" font-family="monospace" font-size="9">Bespoke technical proposal drafted in 780ms</text>

  <!-- Step 2: Resend Dual-Channel Delivery -->
  <rect x="432" y="194" width="326" height="62" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="452" cy="225" r="10" fill="#06B6D4"/>
  <text x="470" y="218" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">2. Resend Dual-Dispatch Delivery</text>
  <text x="470" y="234" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">→ Client: Instant branded personalized HTML confirmation</text>
  <text x="470" y="246" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="9">→ Executive Team: Rich lead brief with contact details &amp; scope</text>

  <!-- Step 3: Google Sheets Database Sync -->
  <rect x="432" y="266" width="326" height="62" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="452" cy="297" r="10" fill="#10B981"/>
  <text x="470" y="290" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">3. Google Sheets Real-Time Sync</text>
  <text x="470" y="306" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Automated append to encrypted spreadsheet database</text>
  <text x="470" y="318" fill="#6EE7B7" font-family="monospace" font-size="9">Row inserted with UTC timestamp • 0% Data Loss</text>

  <!-- Bottom Live Verification Pill -->
