  <text x="52" y="270" fill="#93C5FD" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">AI Consultant:</text>
  <text x="52" y="286" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="10">We engineer Vision-LLM pipelines with &lt;1% discrepancy alerts.</text>
  <text x="52" y="302" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">&gt; Initiating personalized scope &amp; executive briefing...</text>

  <!-- Chat Input Bar -->
  <rect x="40" y="374" width="328" height="36" rx="6" fill="#020817" stroke="#1E293B"/>
  <text x="52" y="396" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10">Ask anything or request a technical quote...</text>

  <!-- Center Arrow Relay -->
