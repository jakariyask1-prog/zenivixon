  <circle cx="48" cy="46" r="4" fill="#06B6D4" />
  <text x="60" y="51" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEB &amp; AI AUTOMATION</text>
